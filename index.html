<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mays Massalha | Organizational Consulting</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#F6F1E8;
  color:#4A4A4A;
}

/* 🎬 LOGIN */
#login{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;
  overflow:hidden;
  z-index:9999;

  /* fallback אם וידאו לא נטען */
  background: linear-gradient(135deg,#2F4F3E,#3A2E2A);
}

/* 🎬 VIDEO */
#bgVideo{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-1;
}

#overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.5);
  z-index:-1;
}

.logo{
  font-size:20px;
  color:#C6A15B;
  margin-bottom:10px;
}

input{
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  width:220px;
  text-align:center;
}

button{
  margin-top:10px;
  padding:12px 25px;
  border:none;
  border-radius:10px;
  background:#2F4F3E;
  color:white;
  cursor:pointer;
}

/* MAIN */
#content{
  display:none;
}

/* HEADER */
header{
  padding:100px 20px;
  text-align:center;
  background:linear-gradient(135deg,#3A2E2A,#2F4F3E);
  color:white;
}

header h1{
  font-size:48px;
  margin:0;
  color:#C6A15B;
}

/* BUTTONS */
.btn{
  display:inline-block;
  margin:10px 6px;
  padding:12px 20px;
  background:#C6A15B;
  color:#2B2B2B;
  border-radius:999px;
  text-decoration:none;
  font-weight:bold;
}

/* CARDS */
.card{
  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  border-right:4px solid #C6A15B;
}

/* PROFILE */
.profile{
  position:fixed;
  left:20px;
  top:120px;
  width:210px;
  background:white;
  border-radius:20px;
  padding:18px;
  text-align:center;
}

/* PANEL */
#panel{
  display:none;
  position:fixed;
  inset:0;
  background:white;
  padding:40px;
  overflow:auto;
  z-index:9999;
}

/* CONTACT FORM */
input, textarea{
  width:100%;
  max-width:500px;
  margin-top:10px;
}

textarea{
  padding:12px;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- 🎬 LOGIN -->
<div id="login">

  <video autoplay muted loop playsinline id="bgVideo">
    <source src="https://cdn.coverr.co/videos/coverr-working-in-an-office-1579/1080p.mp4" type="video/mp4">
  </video>

  <div id="overlay"></div>

  <div class="logo">Mays Massalha | Organizational Consulting</div>

  <h2>כניסת לקוחות</h2>

  <input id="user" placeholder="שם משתמש">
  <input id="pass" type="password" placeholder="סיסמה">
  <button onclick="login()">כניסה</button>
</div>

<!-- MAIN -->
<div id="content">

<header>
  <h1>Mays Massalha</h1>
  <p>ייעוץ ארגוני | שינוי | צמיחה</p>

  <a class="btn" href="#about">אודות</a>
  <a class="btn" href="#contact">צור קשר</a>
  <a class="btn" onclick="openPanel()">אזור אישי</a>
</header>

<section id="about">
  <div class="card">
    <h3>אודות</h3>
    יועצת ארגונית ומנחה אקדמית המתמחה בליווי תהליכי שינוי ופיתוח ארגוני.
  </div>
</section>

<section id="contact">
  <div class="card">
    <h3>יצירת קשר</h3>

    <input placeholder="שם מלא">
    <input placeholder="טלפון">
    <input placeholder="אימייל">
    <textarea rows="4" placeholder="הודעה"></textarea>

    <button>שליחה</button>
  </div>
</section>

</div>

<!-- PANEL -->
<div id="panel">
  <button onclick="closePanel()">סגור</button>

  <h2>אזור אישי</h2>

  <div class="card">
    <h3>כניסה לאזור אישי</h3>

    <input id="clientUser" placeholder="שם משתמש">
    <input id="clientPass" type="password" placeholder="סיסמה">

    <button onclick="checkClient()">כניסה</button>
  </div>

  <div class="card">
    כאן יוצגו מסמכים וסיכומים אישיים ללקוח.
  </div>
</div>

<script>
function login(){
  let u=document.getElementById("user").value;
  let p=document.getElementById("pass").value;

  if(u==="Mays Massalha" && p==="1234"){
    document.getElementById("login").style.display="none";
    document.getElementById("content").style.display="block";
  } else {
    alert("שגיאה בפרטים");
  }
}

function openPanel(){
  document.getElementById("panel").style.display="block";
}

function closePanel(){
  document.getElementById("panel").style.display="none";
}

function checkClient(){
  let u=document.getElementById("clientUser").value;
  let p=document.getElementById("clientPass").value;

  if(u==="Mays Massalha" && p==="1234"){
    alert("גישה מאושרת");
  } else {
    alert("שגוי");
  }
}
</script>

</body>
</html>
